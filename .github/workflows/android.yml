name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install audited dependencies
        run: |
          npm ci
          npm audit --audit-level=high
          node scripts/patch-capacitor-cli-tar.js

      - name: Verify shared audio, edition, icon, and JavaScript sources
        run: |
          node --check app.js
          python3 scripts/verify_audio_sources.py
          python3 scripts/verify_asset_provenance.py

      - name: Copy web files and sync Android project
        run: npm run android:sync

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify audited web assets are inside the APK
        run: |
          python3 - <<'PY'
          import zipfile
          apk = 'android/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as archive:
              app = archive.read('assets/public/app.js').decode()
              html = archive.read('assets/public/index.html').decode()
          assert 'everyayah.com' not in app.lower()
          assert 'cdn.mp3quran.net/audio/abdulbasit-abdulsamad/r2/' in app
          assert "'ar.waseet'" not in app and "'id.indonesian'" not in app
          assert 'displayHafsSource' in app and '۝${toArabicDigits(a.n)}' in app
          assert 'hafs-reader' in html and 'reader-wide' in html
          assert '🎨' in html and '🎵' not in html
          PY

      - name: Copy APK to downloads
        run: cp android/app/build/outputs/apk/debug/app-debug.apk downloads/quran-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
