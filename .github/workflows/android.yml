name: Build Android Release

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app.js'
      - 'smart-context.js'
      - 'smart-services.js'
      - 'tajweed-learning.js'
      - 'tajweed-curriculum-loader.js'
      - 'tajweed-learning-catalog.json'
      - 'tests/*.test.js'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-www.sh'
      - 'scripts/publish-update.sh'
      - 'scripts/verify_release_channel.py'
      - 'scripts/product_copy.py'
      - 'scripts/verify_android_bundle.py'
      - 'scripts/verify_audio_sources.py'
      - 'scripts/verify_asset_provenance.py'
      - 'scripts/verify_data_provenance.py'
      - 'scripts/verify_tajweed_learning.py'
      - 'scripts/verify_tajweed_scopes.py'
      - 'scripts/verify_tajweed_source_candidates.py'
      - 'scripts/analyze_warsh_tajweed_candidate.py'
      - 'audit/tajweed-source-candidates.json'
      - 'audit/tajweed-candidates/**'
      - 'tajweed-curriculum.schema.json'
      - 'tajweed-scope-registry.json'
      - 'tajweed-curricula/**'
      - 'quran-*.json'
      - 'surahs.json'
      - 'tafsir-catalog.json'
      - 'fonts/**'
      - 'LICENSE'
      - 'LICENSE.ar.md'
      - 'LICENSES/**'
      - 'NOTICE.md'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the signed APK and advance the stable Android update channel'
        required: true
        type: boolean
        default: false
      confirmation:
        description: 'For publication type: PUBLISH IMMUTABLE siraj-android-v<version>-b<versionCode> (e.g. siraj-android-v1.0.0-b157)'
        required: false
        type: string
      features:
        description: 'What is new for users; separate up to five concise features with | (required for publication)'
        required: false
        type: string
      apk_update:
        description: 'Offer the new APK to installed apps (default: keep delivering in-app shell updates)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install audited dependencies
        run: |
          npm ci
          npm audit --audit-level=high
          node scripts/patch-capacitor-cli-tar.js

      - name: Verify JavaScript, licensed data, audio, and owned assets
        run: |
          node --check app.js
          node --check smart-context.js
          node --check smart-services.js
          node --check tajweed-learning.js
          node --check tajweed-curriculum-loader.js
          npm run test:smart
          python3 scripts/verify_tajweed_learning.py
          python3 scripts/verify_tajweed_scopes.py
          python3 scripts/verify_tajweed_source_candidates.py
          python3 scripts/verify_android_bundle.py
          python3 scripts/verify_audio_sources.py
          python3 scripts/verify_asset_provenance.py
          python3 scripts/verify_data_provenance.py
          python3 scripts/verify_release_channel.py

      - name: Copy local web assets and sync Capacitor
        run: npm run android:sync

      - name: Prepare required release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/siraj-release.jks"
          test -s "$RUNNER_TEMP/siraj-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/siraj-release.jks" >> "$GITHUB_ENV"

      - name: Build and lint signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 testReleaseUnitTest lintRelease assembleRelease

      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)
          CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -1)
          test -n "$VERSION" && test -n "$CODE"
          {
            echo "version=$VERSION"
            echo "code=$CODE"
            echo "tag=siraj-android-v$VERSION-b$CODE"
            echo "asset=Siraj-Android-$VERSION.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Verify signer, version gate, and packaged assets
        shell: bash
        env:
          REQUIRE_UPGRADE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          OLD_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs update/app.apk 2>&1 | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          NEW_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" 2>&1 | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test -n "$OLD_CERT" && test "$NEW_CERT" = "$OLD_CERT"
          OLD_CODE=$("$BUILD_TOOLS/aapt" dump badging update/app.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          NEW_CODE=$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          if [[ "$REQUIRE_UPGRADE" == "true" ]]; then
            test "$NEW_CODE" -gt "$OLD_CODE"
          else
            test "$NEW_CODE" -ge "$OLD_CODE"
          fi
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionName='${{ steps.meta.outputs.version }}'"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -Fq "application-label:'سراج — قرآن كريم'"
          python3 - <<'PY'
          import json
          import re
          import zipfile
          apk = 'android/app/build/outputs/apk/release/app-release.apk'
          required = {
              'assets/public/app.js', 'assets/public/smart-context.js',
              'assets/public/smart-services.js', 'assets/public/tajweed-learning.js',
              'assets/public/tajweed-curriculum-loader.js',
              'assets/public/index.html', 'assets/public/sw.js',
              'assets/public/quran-hafs.json', 'assets/public/quran-tajweed.json',
              'assets/public/tajweed-learning-catalog.json',
              'assets/public/tajweed-scope-registry.json',
              'assets/public/surahs.json', 'assets/public/tafsir-catalog.json',
              'assets/public/fonts/Amiri-Regular.ttf',
              'assets/public/fonts/AmiriQuran-Regular.ttf',
              'assets/public/fonts/NotoNaskhArabic-Variable.ttf',
              'assets/public/fonts/ScheherazadeNew-Regular.ttf',
              'assets/public/legal/LICENSE',
              'assets/public/legal/LICENSE.ar.md',
              'assets/public/legal/NOTICE.md',
              'assets/public/legal/MIT-HISTORICAL.txt',
          }
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              assert not (required - names), required - names
              app = archive.read('assets/public/app.js').decode()
              smart_context = archive.read('assets/public/smart-context.js').decode()
              smart_services = archive.read('assets/public/smart-services.js').decode()
              tajweed_learning = archive.read('assets/public/tajweed-learning.js').decode()
              tajweed_loader = archive.read('assets/public/tajweed-curriculum-loader.js').decode()
              tajweed_catalog = archive.read('assets/public/tajweed-learning-catalog.json').decode()
              html = archive.read('assets/public/index.html').decode()
              service_worker = archive.read('assets/public/sw.js').decode()
          assert 'everyayah.com' not in app.lower()
          assert 'SmartContextEngine' in smart_context and 'LIKELY_SLEEPING' in smart_context
          assert 'buildCandidates' in smart_services and 'open_adhkar:morning' in smart_services
          assert 'TajweedLearningEngine' in tajweed_learning and 'reviewedEntry' in tajweed_learning
          assert 'loadRegistryCurricula' in tajweed_loader and 'PACKAGE_HASH_MISMATCH' in tajweed_loader
          assert 'annotatedSegments' in tajweed_loader and 'annotationIndex' in tajweed_loader
          assert 'PENDING_SCHOLARLY_REVIEW' in tajweed_catalog and 'source-unspecified' in tajweed_catalog
          assert "run(null, 'smart-context.js')" in html
          assert "run(null, 'smart-services.js')" in html
          assert "run(null, 'tajweed-learning.js')" in html
          assert "run(null, 'tajweed-curriculum-loader.js')" in html
          assert 'id="setSmartEnabled"' in html and 'id="smartSuggestion"' in html
          assert 'id="tjStartLearning"' in html and 'id="tjLearningCard"' in html
          assert 'id="setTajweedScope"' in html and 'syncTajweedScopeSelector' in app
          assert 'لا يرسل ملف عادات إلى خادم' in html
          assert 'new SmartContextAPI.SmartContextEngine' in app
          assert 'new TajweedLearningAPI.TajweedLearningEngine' in app
          assert 'TajweedCurriculumLoaderAPI.loadRegistryCurricula' in app
          assert 'currentApprovedTajweedCurriculum' in app and 'renderIndependentTajweed' in app
          assert 'replaceUpdateDataAssets' in app and 'SIRAJ_UPDATE_DATA_FILES' in app
          assert 'لا تُعرض أحكام حفص أو أي طبقة عامة' in app
          assert "markShown(candidate, suggestionId, 'suggestion')" in app
          assert 'TafsirStore' in app and 'Reminder' in app and 'ar.parhizgar' in app
          assert 'loadBundledData()' in app and 'recordWirdPage' in app
          package_version = json.load(open('package.json', encoding='utf-8'))['version']
          assert f"APP_BUNDLE_VERSION = '{package_version}'" in html, 'APP_BUNDLE_VERSION drift'
          assert f'الإصدار {package_version}' in html, 'about version drift'
          approved_features = (
              'مصحف ذكي للتلاوة والاستماع والتدبر',
              'برواية حفص عن عاصم وروايات أخرى',
              'تحديد الأوراد والختمات ومتابعتها',
              'الأذكار بعداد خاص لكل ذكر',
              'تفاسير القرآن',
          )
          assert all(feature in html for feature in approved_features)
          assert '<h2 class="about-title">سراج</h2>' in html and 'مصحف قرآن كريم' in html
          assert 'أحدث التحديثات' not in html and 'مميزات سراج الحالية' not in html
          assert 'محمد صلاح عبد الخالق' in html and 'اتصل بنا' in html
          assert '<section class="view" id="view-about">' in html
          assert '<div class="header-brand" aria-label="سراج">' in html
          assert '.header-brand span { font-family: Amiri, serif;' in html
          settings = re.search(r'<section class="view" id="view-settings">(.*?)</section>', html, re.DOTALL).group(1)
          assert 'id="aboutBtn"' not in html and "$('#aboutBtn')" not in app
          assert re.search(r'id="settingsAboutBtn".*?</button>\s*$', settings, re.DOTALL)
          assert "$('#settingsAboutBtn').addEventListener('click', () => showView('about'))" in app
          assert "name === 'about' && b.dataset.view === 'settings'" in app
          assert 'data-icon="about"' in settings and 'about:' in app
          assert '--mobile-nav-h: 64px' in html and '--mobile-nav-h: 58px' in html
          assert 'يتوفر تحديث جديد لسراج — الإصدار' in app and 'فيه تحديث جديد' not in app
          assert 'publicUpdateFeatures' in app and 'technicalTerms' in app and '\\nالجديد:' in app
          assert '.upd-banner span { flex: 1; white-space: pre-line; }' in html
          assert 'class="reader-dock"' in html and 'id="pPrevS"' in html and 'id="pNextS"' in html
          assert 'id="audioSeek"' in html and 'class="player-controls"' in html
          assert '--reader-dock-h' in html and 'safe-area-inset-bottom' in html and 'safe-area-inset-left' in html
          assert 'group-menu-open' in html and 'reader-view-active' in html and 'body.group-menu-open .hdr' in html
          assert 'syncReaderDockHeight' in app and 'syncAudioTimeline' in app
          assert 'syncGroupMenuLayer' in app and 'focusFirst' in app and 'restoreFocus' in app
          assert re.search(r'siraj-shell-v[0-9]+', service_worker), 'service worker cache name missing'
          assert "'./smart-context.js'" in service_worker and "'./smart-services.js'" in service_worker
          assert "'./tajweed-learning.js'" in service_worker and "'./tajweed-learning-catalog.json'" in service_worker
          assert "'./tajweed-curriculum-loader.js'" in service_worker and 'curriculumArtifacts' in service_worker
          assert 'data-icon="tajweed"' in html and '🎵' not in html
          PY

      - name: Prepare release artifacts and checksums
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/${{ steps.meta.outputs.asset }}"
          (cd artifacts && sha256sum "${{ steps.meta.outputs.asset }}" > SHA256SUMS.txt)
          SHA=$(cut -d' ' -f1 artifacts/SHA256SUMS.txt)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: siraj-android-${{ steps.meta.outputs.version }}-signed
          path: |
            artifacts/${{ steps.meta.outputs.asset }}
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Require explicit immutable publication approval
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = 'refs/heads/main'
          test "$CONFIRMATION" = "PUBLISH IMMUTABLE $TAG"

      - name: Require fresh user-facing update features
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          UPDATE_FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from scripts.product_copy import validate_update_features
          features = validate_update_features(os.environ.get('UPDATE_FEATURES', '').split('|'))
          if not features:
              raise SystemExit('at least one user-facing update feature is required')
          print('\n'.join('• ' + feature for feature in features))
          PY

      - name: Require a new release tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o "$RUNNER_TEMP/existing-release.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          test "$CODE" = 404
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG")"

      - name: Stage every asset on a draft GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
          UPDATE_FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/create-release.json"
          import json, os
          from scripts.product_copy import validate_update_features
          features = validate_update_features(os.environ['UPDATE_FEATURES'].split('|'))
          feature_lines = '\n'.join('- ' + feature for feature in features)
          print(json.dumps({
              'tag_name': os.environ['TAG'],
              'target_commitish': os.environ['GITHUB_SHA'],
              'name': f"سراج — Android {os.environ['VERSION']}",
              'body': 'الجديد في هذا الإصدار:\n\n' + feature_lines,
              'draft': True,
              'prerelease': False,
          }, ensure_ascii=False))
          PY
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/create-release.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/draft-release.json"
          RELEASE_ID=$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/draft-release.json'))['id'])")
          test -n "$RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          for FILE in "artifacts/$ASSET" artifacts/SHA256SUMS.txt; do
            NAME=$(basename "$FILE")
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              -H 'Content-Type: application/octet-stream' \
              --data-binary @"$FILE" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$NAME" \
              > "$RUNNER_TEMP/upload-$NAME.json"
          done

      - name: Publish the fully staged immutable release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H 'Content-Type: application/json' \
            --data '{"draft":false,"prerelease":false,"make_latest":"true"}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > "$RUNNER_TEMP/published-release.json"
          python3 - <<'PY'
          import json, os
          release = json.load(open(os.environ['RUNNER_TEMP'] + '/published-release.json'))
          assert release['tag_name'] == os.environ['TAG']
          assert release['draft'] is False and release['prerelease'] is False
          assert release.get('immutable') is True, 'Repository Immutable Releases must be enabled before publication'
          assets = {item['name'] for item in release['assets']}
          assert assets == {os.environ['ASSET'], 'SHA256SUMS.txt'}, assets
          PY

      - name: Advance stable in-app update channel without replacing the Release asset
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: ${{ steps.meta.outputs.asset }}
          APK_SHA256: ${{ steps.artifacts.outputs.sha256 }}
          APK_CODE: ${{ steps.meta.outputs.code }}
          APK_UPDATE: ${{ inputs.apk_update }}
          UPDATE_FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          IFS='|' read -r -a FEATURES <<< "$UPDATE_FEATURES"
          # القناة قد تكون قُدّمت مسبقًا بنفس البناء عند التحقق المحلي؛ التكرار هنا لا معنى له.
          CHANNEL_BUILD=$(python3 -c "import json;print(json.load(open('update/manifest.json')).get('build') or 0)")
          SHELL_BUILD=$(cat BUILD_NUMBER)
          if [ "$CHANNEL_BUILD" = "$SHELL_BUILD" ]; then
            echo "channel already at build $APK_CODE"
          else
            bash scripts/publish-update.sh "$VERSION" "${FEATURES[@]}"
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('update/manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          version = os.environ['VERSION']
          # القناة تفضّل التحديث الداخلي: لا نرفع مؤشر الـAPK إلا إذا طُلب صراحة،
          # حتى تصل الترقية إلى التطبيق المثبَّت من داخله بدل إجباره على تنزيل ملف.
          if os.environ.get('APK_UPDATE') == 'true':
              data['apk'] = {
                  'version': version,
                  'code': int(os.environ['APK_CODE']),
                  'url': 'https://github.com/mosalah30688-gif/quran/releases/download/' + os.environ['TAG'] + '/' + os.environ['ASSET'],
                  'sha256': os.environ['APK_SHA256'],
              }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A update
          if ! git diff --cached --quiet; then
            git commit -m "Android $VERSION: advance stable immutable release channel [skip ci]"
            git push origin HEAD:main
          fi
