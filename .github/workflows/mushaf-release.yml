name: Mushaf desktop release (Linux AppImage + Windows)

on:
  push:
    tags: ['mushaf-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libgl1 libnss3 libxss1 libasound2t64
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mushaf-v* ]]; then
            echo "version=${GITHUB_REF_NAME#mushaf-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build AppImage
        working-directory: shell
        run: ./build_appimage.sh "${{ steps.ver.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: shell/Mushaf-*.AppImage
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/mushaf-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: shell/Mushaf-*.AppImage

  windows:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mushaf-v* ]]; then
            echo "version=${GITHUB_REF_NAME#mushaf-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        working-directory: shell
        run: python -m pip install -q -r requirements.txt
      - name: Build folder version (fast start)
        working-directory: shell
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --windowed --name mushaf --add-data "../www;www" main.py
          ./prune_bundle.sh dist/mushaf
          cd dist && 7z a -tzip "../Mushaf-${{ steps.ver.outputs.version }}-windows.zip" mushaf > /dev/null
      - name: Build portable single EXE
        working-directory: shell
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --windowed --onefile --name mushaf \
            --distpath dist-onefile --workpath build-onefile --add-data "../www;www" main.py
          mv dist-onefile/mushaf.exe "Mushaf-${{ steps.ver.outputs.version }}-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            shell/Mushaf-*-windows.zip
            shell/Mushaf-*-portable.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/mushaf-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            shell/Mushaf-*-windows.zip
            shell/Mushaf-*-portable.exe
