name: Mushaf desktop release (Linux AppImage + Windows)

# كل بناء بيتشغل بوضع الاختبار (--selftest): لو الواجهة ما اتحمّلتش، البناء بيفشل ومفيش نشر.
on:
  push:
    tags: ['mushaf-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libgl1 libnss3 libxss1 libasound2t64 libpulse0
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mushaf-v* ]]; then
            echo "version=${GITHUB_REF_NAME#mushaf-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build AppImage
        working-directory: shell
        run: ./build_appimage.sh "${{ steps.ver.outputs.version }}"
      - name: Self-test AppImage
        working-directory: shell
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./Mushaf-${{ steps.ver.outputs.version }}-x86_64.AppImage --appimage-extract-and-run --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: shell/Mushaf-*.AppImage
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/mushaf-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: shell/Mushaf-*.AppImage

  windows:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mushaf-v* ]]; then
            echo "version=${GITHUB_REF_NAME#mushaf-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        working-directory: shell
        run: python -m pip install -q -r requirements.txt
      - name: Build portable folder
        working-directory: shell
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --windowed --name mushaf --add-data "../www;www" main.py
          bash ./prune_bundle.sh dist/mushaf
          mv dist/mushaf "dist/Mushaf-${{ steps.ver.outputs.version }}"
      - name: Self-test Windows build
        working-directory: shell
        shell: bash
        run: |
          ./"dist/Mushaf-${{ steps.ver.outputs.version }}/mushaf.exe" --selftest
      - name: Zip portable build
        working-directory: shell/dist
        shell: bash
        run: 7z a -tzip "../Mushaf-${{ steps.ver.outputs.version }}-windows-portable.zip" "Mushaf-${{ steps.ver.outputs.version }}" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: shell/Mushaf-*-windows-portable.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/mushaf-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: shell/Mushaf-*-windows-portable.zip
