name: Native desktop release (Linux AppImage + Windows portable)

on:
  push:
    tags: ['native-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libgl1 libfuse2
      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/native-v* ]]; then
            echo "version=${GITHUB_REF_NAME#native-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build AppImage
        working-directory: native
        run: ./build_appimage.sh "${{ steps.ver.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: native/Mushaf-*.AppImage
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/native-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: native/Mushaf-*.AppImage

  windows:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/native-v* ]]; then
            echo "version=${GITHUB_REF_NAME#native-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build portable EXE
        working-directory: native
        shell: bash
        run: |
          python -m pip install -q -r requirements.txt
          python -m PyInstaller --noconfirm --onefile --windowed --name mushaf \
            --add-data "data;data" --add-data "fonts;fonts" mushaf.py
          mv dist/mushaf.exe "Mushaf-${{ steps.ver.outputs.version }}-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: native/Mushaf-*-portable.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/native-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: native/Mushaf-*-portable.exe
