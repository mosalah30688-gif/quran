name: "Siraj Windows — build, test and release"

on:
  workflow_dispatch:
  push:
    tags:
      - "siraj-windows-v*"
      - "siraj-windows-patch-v*"
      - "siraj-windows-test-v*"

concurrency:
  group: siraj-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: windows_app/requirements.txt

      - name: Download and verify the locked offline tafsir store
        shell: pwsh
        run: python scripts/fetch_offline_tafsir_data.py --output windows_app/data/tafsir-offline.sqlite3

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows_app/requirements.txt
          python -m pip install pip-audit cyclonedx-bom==7.5.0
          python -m pip_audit -r windows_app/requirements.txt --progress-spinner off

      - name: Validate update-channel signing key when publishing
        shell: pwsh
        env:
          WINDOWS_UPDATE_SIGNING_SEED: ${{ secrets.WINDOWS_UPDATE_SIGNING_SEED }}
        run: |
          $IsPublishTag = "${{ github.ref_type }}" -eq "tag" -and -not "${{ github.ref_name }}".StartsWith("siraj-windows-test-v")
          if ($IsPublishTag -and [string]::IsNullOrWhiteSpace($env:WINDOWS_UPDATE_SIGNING_SEED)) {
            throw "Stable full or patch releases require WINDOWS_UPDATE_SIGNING_SEED"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_UPDATE_SIGNING_SEED)) {
            python -c "import os,base64; from nacl.signing import SigningKey; seed=base64.b64decode(os.environ['WINDOWS_UPDATE_SIGNING_SEED']); expected=open('windows_app/assets/update_public_key.txt').read().strip(); assert SigningKey(seed).verify_key.encode().hex()==expected, 'Update signing seed does not match embedded public key'"
          }

      - name: Validate version and tag
        shell: pwsh
        run: |
          $Version = python -c "import sys; sys.path.insert(0,'windows_app'); import version; print(version.APP_VERSION)"
          if ("${{ github.ref_type }}" -eq "tag") {
            $TagVersion = "${{ github.ref_name }}" `
              -replace '^siraj-windows-patch-v','' `
              -replace '^siraj-windows-test-v','' `
              -replace '^siraj-windows-v',''
            if ($TagVersion -ne $Version) { throw "Tag $TagVersion does not match app version $Version" }
            if ("${{ github.ref_name }}" -like 'siraj-windows-patch-v*') {
              python -c "from packaging.version import Version; assert Version('$Version') > Version('1.1.0'), 'Patch releases require a version newer than transitional 1.1.0'"
            }
          }

      - name: Update and portable-mode unit tests
        shell: pwsh
        run: python -m unittest discover -s windows_app/tests -p "test_*.py" -v

      - name: Verify locked content provenance and approved live editions
        shell: pwsh
        run: |
          python scripts/verify_data_provenance.py
          python scripts/verify_asset_provenance.py
          python scripts/generate_alquran_data.py --verify
          python scripts/generate_quranpedia_data.py --verify
          python scripts/generate_quranpedia_tafsir_catalog.py --verify
          python scripts/fetch_offline_tafsir_data.py --output windows_app/data/tafsir-offline.sqlite3 --verify
          python scripts/build_offline_tafsir.py --output windows_app/data/tafsir-offline.sqlite3 --verify
          python scripts/generate_adhkar_data.py --verify
          python scripts/audit_alquran_editions.py --verify
          python scripts/verify_audio_sources.py

      - name: Full UI regression test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          SHOTS: ${{ runner.temp }}\siraj-shots
          SIRAJ_PORTABLE: "1"
        run: python windows_app/tests/ui_test.py

      - name: Build and double-click test the unsigned portable package
        shell: pwsh
        run: windows_app\packaging\build_windows.ps1

      - name: Bundle corresponding source for LGPL components
        shell: pwsh
        run: |
          $Version = python -c "import sys; sys.path.insert(0,'windows_app'); import version; print(version.APP_VERSION)"
          $SourceName = "Siraj-Quran-$Version-windows-corresponding-source.zip"
          python scripts/prepare_corresponding_sources.py `
            --platform windows `
            --version $Version `
            --cache "$env:RUNNER_TEMP\siraj-source-cache" `
            --output "windows_app\release\$SourceName"
          $Hash = (Get-FileHash "windows_app\release\$SourceName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $SourceName" | Out-File -FilePath windows_app/release/SHA256SUMS.txt -Append -Encoding ascii

      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: |
          cyclonedx-py requirements windows_app/requirements.txt `
            --output-format JSON `
            --output-reproducible `
            --output-file windows_app/release/SBOM.cdx.json
          $ReleaseDirs = @(Get-ChildItem windows_app/release -Directory)
          if ($ReleaseDirs.Count -ne 0) { throw "Release directory must contain final files only" }
          $ReleaseFiles = @(Get-ChildItem windows_app/release -File)
          if ($ReleaseFiles.Count -ne 4) { throw "Expected portable ZIP, corresponding source, checksums and SBOM only" }

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siraj-windows-ui-screenshots
          path: ${{ runner.temp }}\siraj-shots\*.png
          if-no-files-found: ignore

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            windows_app/release/*.zip
            windows_app/release/SHA256SUMS.txt
            windows_app/release/SBOM.cdx.json

      - name: Upload tested Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: siraj-windows-portable
          path: windows_app/release/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: >-
      startsWith(github.ref, 'refs/tags/siraj-windows-v') ||
      startsWith(github.ref, 'refs/tags/siraj-windows-patch-v')
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up manifest signer
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Enforce explicit audit approval before creating a Draft
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:audit/RELEASE_GATE.json > "$RUNNER_TEMP/RELEASE_GATE.json"
          RELEASE_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          python scripts/check_release_gate.py \
            --gate "$RUNNER_TEMP/RELEASE_GATE.json" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$RELEASE_COMMIT"

      - name: Install update signing and verification dependencies
        run: python -m pip install PyNaCl==1.6.2 packaging==26.3

      - name: Download tested artifacts
        uses: actions/download-artifact@v4
        with:
          name: siraj-windows-portable
          path: release

      - name: Prepare signed full or patch draft assets
        shell: bash
        env:
          WINDOWS_UPDATE_SIGNING_SEED: ${{ secrets.WINDOWS_UPDATE_SIGNING_SEED }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#siraj-windows-patch-v}"
          VERSION="${VERSION#siraj-windows-v}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          rm -rf publish
          mkdir publish

          if [[ "$GITHUB_REF_NAME" == siraj-windows-patch-v* ]]; then
            PATCH="publish/Siraj-Quran-${VERSION}-windows.sirajpatch"
            python scripts/generate_signed_patch.py \
              --product siraj-quran-windows \
              --version "$VERSION" \
              --app-dir windows_app \
              --notes "ترقيع صغير موقّع لسراج Windows؛ لا يغيّر المحرك الأصلي." \
              --output "$PATCH"
            python scripts/generate_patch_channel.py \
              --product siraj-quran-windows \
              --version "$VERSION" \
              --patch "$PATCH" \
              --base-url "$BASE_URL" \
              --notes "ترقيع صغير موقّع لسراج Windows." \
              --output publish/patch-stable.json
            PATCH_PATH="$PATCH" python - <<'PY'
          import json, os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'windows_app')
          import patch_runtime
          import update_security
          public = Path('windows_app/assets/update_public_key.txt')
          channel = json.load(open('publish/patch-stable.json', encoding='utf-8'))
          assert update_security.verify_update_manifest(channel, public)
          with tempfile.TemporaryDirectory() as folder:
              manifest = patch_runtime.install_patch_archive(
                  Path(os.environ['PATCH_PATH']), product='siraj-quran-windows', runtime_api=1,
                  bundled_version='1.1.0', public_key_path=public,
                  patch_root=Path(folder) / 'patches')
              assert manifest['version'] == channel['version']
          PY
            (cd publish && sha256sum "$(basename "$PATCH")" patch-stable.json > SHA256SUMS.txt)
            cp release/SBOM.cdx.json publish/SBOM.cdx.json
            cat > release-notes.md <<EOF
          # سراج ${VERSION} — ترقيع Windows موقّع

          - ترقيع صغير بعد الحزمة الانتقالية الكاملة 1.1.0.
          - لا يحتوي مثبتًا ولا يستبدل ملفات runtime الأصلية.
          - تتحقق النسخة الانتقالية من Ed25519 وSHA-256 لكل ملف قبل تشغيله، مع رجوع آمن للنسخة المضمّنة.
          - هذا Draft فقط؛ لا تُفعّل قناة التحديث قبل المراجعة والترقية الصريحة.
          EOF
            echo "DRAFT_TITLE=سراج ${VERSION} — ترقيع Windows" >> "$GITHUB_ENV"
          else
            PORTABLE="release/Siraj-Quran-${VERSION}-windows-portable-x64.zip"
            python scripts/generate_windows_update_manifest.py \
              --version "$VERSION" \
              --portable "$PORTABLE" \
              --base-url "$BASE_URL" \
              --notes "حزمة سراج Windows Portable الكاملة؛ قناة التحديث موقعة بـ Ed25519." \
              --output publish/stable.json
            cp release/* publish/
            cat > release-notes.md <<EOF
          # سراج ${VERSION} — قرآن كريم لويندوز

          نسخة Portable فقط؛ لا يوجد مثبت.

          - Windows 10 و11 — x64.
          - فك ZIP كاملًا ثم شغّل Siraj.exe.
          - تحفظ النسخة بياناتها داخل UserData بجوار البرنامج.
          - حزمة corresponding-source المرفقة تحتوي مصادر Qt/PySide المطابقة لحقوق LGPL.
          - ملفات EXE بلا Authenticode وفق سياسة المشروع؛ قناة التحديث نفسها موقعة بـ Ed25519.
          - هذا Draft فقط؛ لا تُنشر القناة المستقرة تلقائيًا.
          EOF
            echo "DRAFT_TITLE=سراج ${VERSION} — Windows Portable" >> "$GITHUB_ENV"
          fi

          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'scripts')
          from update_signing import verify_manifest
          public_key = pathlib.Path('windows_app/assets/update_public_key.txt').read_text(encoding='ascii')
          manifests = list(pathlib.Path('publish').glob('*stable.json'))
          assert len(manifests) == 1, manifests
          manifest = json.loads(manifests[0].read_text(encoding='utf-8'))
          assert verify_manifest(manifest, public_key), 'Generated update manifest signature is invalid'
          PY

      - name: Attest the complete Draft asset set
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: publish/*

      - name: Create draft release only
        shell: bash
        run: |
          set -euo pipefail
          # لا يحوّل هذا المسار الـDraft إلى إصدار عام ولا يحدّث قناة main.
          # الترقية العامة لها workflow صريح منفصل بعد التدقيق.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
            gh release upload "$GITHUB_REF_NAME" publish/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --draft --title "$DRAFT_TITLE" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" publish/* \
              --draft \
              --title "$DRAFT_TITLE" \
              --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY"
          fi
